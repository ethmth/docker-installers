services:
  gitea-public-db:
    image: postgres:17
    container_name: gitea-public-db
    volumes:
      - ./postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=giteadb
      - POSTGRES_HOST_AUTH_METHOD=md5
    restart: "no"

  gitea-public-server:
    image: docker.gitea.com/gitea:latest
    container_name: gitea-public-server
    depends_on:
      gitea-public-db:
        condition: service_started
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea-public-db:5432
      - GITEA__database__NAME=giteadb
      - GITEA__database__USER=postgres
      - GITEA__database__PASSWD=postgres
      - GITEA__repository__FORCE_PRIVATE=false
      - GITEA__repository__DEFAULT_PRIVATE=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE=true
      - GITEA__service__DEFAULT_USER_VISIBILITY=private
      - GITEA__service__ALLOWED_USER_VISIBILITY_MODES=public,limited,private
      - GITEA__service__DEFAULT_ORG_VISIBILITY=private
      - GITEA__service__ALLOW_ONLY_INTERNAL_REGISTRATION=true
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000"
      - "223:22"
    restart: "no"
